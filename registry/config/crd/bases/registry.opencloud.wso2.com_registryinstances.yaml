                - Provisioning
                - Ready
                - Failed
                - Terminating
                type: string
              resources:
                description: Resources tracks owned objects for idempotency.
                items:
                  description: ResourceRef identifies one Kubernetes object owned
                    by the CR.
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    version:
                      type: string
                  required:
                  - kind
                  - name
