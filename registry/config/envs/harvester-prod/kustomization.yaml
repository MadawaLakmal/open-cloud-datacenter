# Harvester Prod overlay.
#
# Two replicas + leader election + pinned image tag. No sample CRs apply
# here — dc-api creates the real ones in production. See
# docs/test-environments.md "harvester-prod recipe".

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../default

# Always pin a release tag in prod. Override `newTag` per deploy:
#   kustomize edit set image controller=ghcr.io/wso2/registry-operator:vX.Y.Z
images:
  - name: controller
    newName: ghcr.io/wso2/registry-operator
    newTag: v0.1.0

patches:
  - path: manager_patch.yaml
    target:
      kind: Deployment
      name: controller-manager
