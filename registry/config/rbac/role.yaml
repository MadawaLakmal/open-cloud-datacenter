---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  # Our CRDs — full CRUD + status + finalizers.
  - apiGroups: ["registry.opencloud.wso2.com"]
    resources: ["registrybackends", "registryinstances"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["registry.opencloud.wso2.com"]
    resources: ["registrybackends/status", "registryinstances/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["registry.opencloud.wso2.com"]
    resources: ["registrybackends/finalizers", "registryinstances/finalizers"]
    verbs: ["update"]

  # Admin Secret, robot-credentials Secret, Helm release storage.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Resources the Harbor chart installs into a tenant namespace.
  - apiGroups: [""]
    resources:
      - configmaps
      - serviceaccounts
      - services
      - persistentvolumeclaims
      - pods
      - events
      - endpoints
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
