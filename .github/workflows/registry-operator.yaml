name: registry-operator

# Build, test, and publish the Harbor registry operator image. Mirrors the
# keyvault-operator workflow so the operators branch enforces one CI shape
# per service.

on:
  pull_request:
    paths:
      - 'registry/**'
      - '.github/workflows/registry-operator.yaml'
  push:
    branches: [operators]
    paths:
      - 'registry/**'
      - '.github/workflows/registry-operator.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/wso2/registry-operator

jobs:
  verify-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The vendored Harbor chart tarball is committed under
      # registry/charts/. CHECKSUMS.txt pins each tarball's SHA-256. Any
      # mutation of the tarball (or a fresh sync without checksum update)
      # fails this step.
      - name: Verify vendored chart checksums
        run: cd registry && make verify-chart

      # Lightweight scan over the chart contents on every PR. Vulnerabilities
      # in YAML are rare but possible (e.g. a known-bad base image referenced
      # by a sub-chart). Blocks merge until acknowledged.
      - name: Trivy scan of vendored chart
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'registry/charts/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  test:
    needs: verify-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: registry/go.sum

      # `make test` orchestrates: manifests + generate (controller-gen),
      # fmt, vet, setup-envtest download of etcd + kube-apiserver
      # binaries into ./bin, then `go test` with KUBEBUILDER_ASSETS set.
      - name: Run unit tests
        run: cd registry && make test

  build-and-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push registry-operator
        uses: docker/build-push-action@v5
        with:
          context: ./registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=registry-operator
          cache-to: type=gha,mode=max,scope=registry-operator

      - name: Summary
        run: |
          {
            echo "### registry-operator published"
            echo
            echo "- \`${{ env.IMAGE }}:latest\`"
            echo "- \`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo
            echo "Consumer-side: the terraform branch's"
            echo "\`modules/operators/registry/\` module pins this image"
            echo "tag in its kustomize-managed Deployment."
          } >> "$GITHUB_STEP_SUMMARY"
